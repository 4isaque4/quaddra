name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Prisma 7 exige DATABASE_URL no prisma.config.ts; generate/build não conectam ao banco no CI
      DATABASE_URL: "postgresql://localhost:5432/dummy?schema=public"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Prisma 7 exige Node 20.19+, 22.12+ ou 24+
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: cd apps/web && npx prisma generate

      - name: Build application
        run: |
          cd apps/web
          npm run build

      - name: Check VPS connectivity
        id: vps_check
        shell: bash
        run: |
          set -e
          HOST="${{ secrets.VPS_HOST }}"
          PORT=22

          echo "🔍 Verificando conectividade com VPS (${HOST}:${PORT})..."

          ok=false
          for attempt in 1 2 3; do
            echo "📡 Tentativa ${attempt}/3..."
            if timeout 8 bash -c "echo > /dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" = true ]; then
            echo "✅ Servidor acessível na porta ${PORT}."
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Servidor inacessível na porta ${PORT}."
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail fast when VPS is unreachable
        if: steps.vps_check.outputs.reachable != 'true'
        run: |
          echo "❌ Deploy abortado: sem conectividade SSH com o VPS."
          echo "➡️ Verifique VPS_HOST, firewall/security group e disponibilidade da porta 22."
          exit 1

      - name: Deploy to VPS
        if: steps.vps_check.outputs.reachable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN_QUADRRA }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 45s
          command_timeout: 900s
          use_insecure_cipher: false
          envs: GITHUB_TOKEN,DATABASE_URL
          script: |
            set -e
            echo "🚀 Iniciando deploy..."

            cd /var/www/quaddra || {
              echo "❌ Erro: Diretório /var/www/quaddra não encontrado!"
              exit 1
            }

            need_node20() {
              echo "❌ Este projeto exige Node.js 20.19+ (Prisma 7)."
              echo "   Instale Node 20 no servidor e tente novamente."
              exit 1
            }

            NODE_VER=$(node -v 2>/dev/null | sed 's/^v//' | cut -d. -f1) || true
            if [ -z "$NODE_VER" ] || [ "$NODE_VER" -lt 20 ] 2>/dev/null; then
              if [ -s "$HOME/.nvm/nvm.sh" ]; then
                . "$HOME/.nvm/nvm.sh"
                nvm install 20 2>/dev/null || true
                nvm use 20
              else
                need_node20
              fi
            fi
            echo "✅ Node $(node -v)"

            if [ -f apps/web/.env.local ]; then
              cp apps/web/.env.local /tmp/.env.local.backup
            fi

            git fetch origin
            git reset --hard origin/main

            if [ -f /tmp/.env.local.backup ]; then
              cp /tmp/.env.local.backup apps/web/.env.local
              echo "✅ .env.local restaurado do backup"
            fi

            if [ ! -f apps/web/.env.local ]; then
              {
                echo "GITHUB_TOKEN=${GITHUB_TOKEN:-}"
                echo "DATABASE_URL=${DATABASE_URL:-}"
                echo "GITHUB_OWNER=4isaque4"
                echo "GITHUB_REPO_QUADDRA=vale-shope-processos"
                echo "GITHUB_REPO_VALESHOP=vale-shope-processos"
                echo "GITHUB_BRANCH=main"
              } > apps/web/.env.local
              echo "✅ .env.local criado"
            fi

            if [ -n "$DATABASE_URL" ] && ! grep -q '^DATABASE_URL=' apps/web/.env.local 2>/dev/null; then
              echo "DATABASE_URL=$DATABASE_URL" >> apps/web/.env.local
            fi

            npm install

            cd apps/web
            rm -rf .next node_modules/.cache
            export DATABASE_URL="${DATABASE_URL:-$(grep -E '^DATABASE_URL=' .env.local 2>/dev/null | cut -d= -f2-)}"
            npx prisma generate
            npm run build
            cd ../..

            pm2 stop quaddra-web 2>/dev/null || true
            pm2 delete quaddra-web 2>/dev/null || true
            pm2 start apps/web/ecosystem.config.js
            pm2 save

            sleep 2
            pm2 describe quaddra-web
            echo "✅ Deploy concluído com sucesso!"
            pm2 status
            pm2 logs quaddra-web --lines 10 --nostream

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = 'success' ]; then
            echo "✅ Deploy realizado com sucesso!"
          else
            echo "❌ Deploy falhou!"
          fi

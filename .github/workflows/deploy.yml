name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Prisma 7 exige DATABASE_URL no prisma.config.ts; generate/build não conectam ao banco no CI
      DATABASE_URL: "postgresql://localhost:5432/dummy?schema=public"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Prisma 7 exige Node 20.19+, 22.12+ ou 24+
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: cd apps/web && npx prisma generate

      - name: Build application
        run: |
          cd apps/web
          npm run build

      - name: Check VPS connectivity
        run: |
          echo "🔍 Verificando conectividade com VPS..."
          echo "📡 Tentando conectar na porta 22..."
          timeout 10 bash -c "echo > /dev/tcp/${{ secrets.VPS_HOST }}/22" 2>/dev/null && echo "✅ Servidor acessível" || echo "⚠️ Servidor pode estar inacessível (continuando mesmo assim...)"
          echo "🔐 Testando autenticação SSH..."

      - name: Deploy to VPS
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN_QUADRRA }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 300s
          command_timeout: 600s
          use_insecure_cipher: false
          envs: GITHUB_TOKEN
          script: |
            set -e
            echo "🚀 Iniciando deploy..."
            echo "📡 Verificando conectividade com o servidor..."
            
            if ! ping -c 3 localhost > /dev/null 2>&1; then
              echo "⚠️ Aviso: Problemas de conectividade detectados"
            fi
            
            cd /var/www/quaddra || {
              echo "❌ Erro: Diretório /var/www/quaddra não encontrado!"
              exit 1
            }
            
            # Prisma 7 e dependências exigem Node 20.19+. Garantir Node 20 no servidor.
            need_node20() {
              echo "❌ Este projeto exige Node.js 20.19+ (Prisma 7)."
              echo "   No servidor, instale e use Node 20, por exemplo:"
              echo "   curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash"
              echo "   source ~/.nvm/nvm.sh && nvm install 20 && nvm alias default 20"
              exit 1
            }
            NODE_VER=$(node -v 2>/dev/null | sed 's/^v//' | cut -d. -f1) || true
            if [ -z "$NODE_VER" ] || [ "$NODE_VER" -lt 20 ] 2>/dev/null; then
              if [ -s "$HOME/.nvm/nvm.sh" ]; then
                echo "📦 Ativando Node 20 via nvm..."
                . "$HOME/.nvm/nvm.sh"
                nvm install 20 2>/dev/null || true
                nvm use 20
              elif [ -s "/root/.nvm/nvm.sh" ]; then
                . "/root/.nvm/nvm.sh"
                nvm install 20 2>/dev/null || true
                nvm use 20
              else
                need_node20
              fi
            fi
            echo "✅ Node $(node -v)"
            
            # Fazer backup rápido do .env (se existir)
            if [ -f apps/web/.env.local ]; then
              cp apps/web/.env.local /tmp/.env.local.backup
            fi
            
            # Atualizar código do repositório
            git fetch origin
            git reset --hard origin/main
            
            # Restaurar .env (se existir backup) ou criar novo com variáveis mínimas
            if [ -f /tmp/.env.local.backup ]; then
              cp /tmp/.env.local.backup apps/web/.env.local
              echo "✅ .env.local restaurado do backup"
            else
              # Criar .env.local se não existir (com valores padrão)
              if [ ! -f apps/web/.env.local ]; then
                echo "⚠️ Criando .env.local (token do GitHub vem do segredo DEPLOY_TOKEN_QUADRRA)..."
                {
                  echo "GITHUB_TOKEN=${GITHUB_TOKEN:-}"
                  echo "GITHUB_OWNER=4isaque4"
                  echo "GITHUB_REPO_QUADDRA=vale-shope-processos"
                  echo "GITHUB_REPO_VALESHOP=vale-shope-processos"
                  echo "GITHUB_BRANCH=main"
                } > apps/web/.env.local
                if [ -n "$GITHUB_TOKEN" ]; then
                  echo "✅ GITHUB_TOKEN preenchido a partir do segredo DEPLOY_TOKEN_QUADRRA"
                else
                  echo "⚠️ Configure o segredo DEPLOY_TOKEN_QUADRRA no repositório ou edite .env.local no servidor"
                fi
              fi
            fi
            
            # Instalar dependências
            npm install
            
            # Build da aplicação
            cd apps/web
            
            # Limpar cache do Next.js antes do build
            echo "🧹 Limpando cache do Next.js..."
            rm -rf .next
            rm -rf node_modules/.cache
            
            # Build da aplicação
            echo "🔨 Executando build..."
            npm run build
            
            cd ../..
            
            # Parar e deletar processo antigo do PM2
            echo "🛑 Parando aplicação antiga..."
            pm2 stop quaddra-web 2>/dev/null || true
            pm2 delete quaddra-web 2>/dev/null || true
            
            # Aguardar um pouco para garantir que o processo foi encerrado
            sleep 2
            
            # Limpar cache do PM2
            pm2 flush quaddra-web 2>/dev/null || true
            
            # Iniciar aplicação com PM2 usando o ecosystem.config.js
            echo "🚀 Iniciando aplicação..."
            pm2 start apps/web/ecosystem.config.js
            pm2 save
            
            # Aguardar aplicação iniciar
            sleep 3
            
            # Verificar se a aplicação está rodando
            pm2 describe quaddra-web
            
            echo "✅ Deploy concluído com sucesso!"
            pm2 status
            pm2 logs quaddra-web --lines 10 --nostream

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deploy realizado com sucesso!"
          else
            echo "❌ Deploy falhou!"
          fi
